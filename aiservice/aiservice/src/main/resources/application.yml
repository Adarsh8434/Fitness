
server:
   port: 8083
spring:
   application:
     name: ai-service
data:
     mongodb:
       uri: mongodb://localhost:27017/fitnessrecommendation
       database: fitnessrecommendation
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking
  listener:
    simple:
      default-requeue-rejected: false

gemini:
  api:
    url: ${GEMINI_API_URL}
    Key: ${GEMINI_API_KEY}